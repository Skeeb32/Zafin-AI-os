[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zafin-ai-os"
version = "0.1.0"
description = "A small, inspectable agent runtime with explicit tool execution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zafin-os = "zafin_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
